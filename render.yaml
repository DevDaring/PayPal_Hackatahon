# Render Blueprint (paid resources: a persistent disk and a background worker are not on the free tier).
# Documents live on the API's disk; the worker shares them only if both run on one service or you
# switch storage to an object store (storage.py is the single place to change). See docs/DEPLOYMENT.md.
databases:
  - name: quoteguard-db
    plan: basic-256mb
services:
  - type: web
    name: quoteguard-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/v1/ready
    disk: { name: documents, mountPath: /data, sizeGB: 1 }
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: quoteguard-db, property: connectionString } }
      - { key: APP_ENV, value: hosted }
      - { key: COOKIE_SECURE, value: "true" }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: APPROVAL_SIGNING_SECRET, generateValue: true }
      - { key: PAYPAL_MODE, value: sandbox }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_MERCHANT_ID, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: AI_API_KEY, sync: false }
  - type: worker
    name: quoteguard-worker
    runtime: docker
    rootDir: backend
    plan: starter
    dockerCommand: python -m quoteguard.worker
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: quoteguard-db, property: connectionString } }
      - { key: APP_ENV, value: hosted }
      - { key: SESSION_SECRET, sync: false }            # copy the API's generated values
      - { key: APPROVAL_SIGNING_SECRET, sync: false }
      - { key: PAYPAL_MODE, value: sandbox }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_MERCHANT_ID, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: AI_API_KEY, sync: false }
  - type: web
    name: quoteguard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - { type: rewrite, source: /api/*, destination: https://quoteguard-api.onrender.com/api/* }
      - { type: rewrite, source: /*, destination: /index.html }
